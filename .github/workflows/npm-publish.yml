# 验证 + 发布。原来的版本跑 `npm ci`（本仓库只有 pnpm-lock.yaml，无 package-lock.json）
# 与 `npm test`（package.json 里根本没有 test 脚本），因此一旦创建 release 必然失败。
# 现在：验证门 = `node scripts/verify.mjs`（零依赖，只用 node 标准库 + npm，无需 install）。
name: Verify and publish

on:
  push:
    # 本地与远端默认分支均为 master，不存在 main。双列以防将来改名（改名风险双向）。
    branches: [master, main]
  pull_request:
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: verify-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 本包无构建步骤、verify.mjs 只用 node 标准库与自带 npm，故不装依赖。
      - run: node scripts/verify.mjs

  selftest:
    # 负向自测：证明 verify.mjs 的每条断言都还能报红（不会失败的检查等于没有检查）。
    # 全部破坏在 os.tmpdir() 的副本上进行，脚本内另有工作区内容对拍护栏。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify.selftest.mjs
      # 两个安装侧探测器的**自证**（造物在 os.tmpdir()，不依赖已装 profile 或 harness checkout）：
      # 判定逻辑必须能报红、且不误报。真实验收见 docs/agents/integration-contracts.md §D 步骤 7/8。
      - run: node scripts/dependency-skew.measure.mjs --selftest
      - run: node scripts/dsh-log-ui.drift.mjs --selftest
      # tag 守卫的本机无法验证项：从上面 publish-npm 的工件里**抽取**真正的 case 块来执行，
      # 而不是在测试里重写一份逻辑（重写就等于测自己）。ubuntu-latest 自带 bash；
      # 开发者本机若无 POSIX shell，这一步只在 CI 上提供证据。
      - name: Tag guard matrix (accept / reject)
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          export VERSION
          awk '/case "\$TAG" in/{f=1} f{print} f&&/esac/{exit}' .github/workflows/npm-publish.yml > "$RUNNER_TEMP/tagcheck.sh"
          test -s "$RUNNER_TEMP/tagcheck.sh"
          grep -q 'esac' "$RUNNER_TEMP/tagcheck.sh"
          echo "--- 抽取到的守卫 ---"; cat "$RUNNER_TEMP/tagcheck.sh"
          for t in "v$VERSION" "$VERSION" "release-$VERSION"; do
            if ! TAG="$t" bash "$RUNNER_TEMP/tagcheck.sh" >/dev/null 2>&1; then
              echo "::error::tag '$t' 应被接受却被拒"; exit 1
            fi
          done
          for t in "v$VERSION"0 "v1$VERSION" "v$VERSION-rc1" ""; do
            if TAG="$t" bash "$RUNNER_TEMP/tagcheck.sh" >/dev/null 2>&1; then
              echo "::error::tag '$t' 应被拒绝却被接受"; exit 1
            fi
          done
          echo "tag 守卫矩阵通过：3 个应接受形态被接受，4 个应拒绝形态被拒绝"

  auto-resume-contract:
    # 启动恢复契约门：两种 list() 形状（快照 / 裸 header）下都选对目标，
    # 未识别形状必须留下可诊断告警。全部副本与破坏在 os.tmpdir()，脚本内自带工作区内容对拍护栏。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 本门用 git cat-file 取「引入修复的那个提交的父版本」作负向对照，
      # 因此**需要完整历史**：默认 fetch-depth: 1 只有 HEAD，`rev^` 不可读会让门以
      # exit 3（未完成验证）报红——这正是它此前在 CI 上长期红着的第二个原因。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/auto-resume.contract.selftest.mjs

  anchor-contract:
    # §0 内容锚门：重算 docs/agents/integration-contracts.md §0 的 12 条锚。
    # 被引文件（lib/**、client/client.js、README.zh.md、package.json、cordis.patch.yml）一旦变动即红——
    # 这是刻意摩擦：重落锚是 Tech Lead 的动作（契约表 §D.6），门只负责把"静默失效"变响。
    # 判据只有哈希；不校验行号（off-by-N 属已知不可机检类）。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/anchor.contract.selftest.mjs

  prompt-contract:
    # 提示词管线契约门：跨段去重不得吃掉空行（markdown 段落分隔）、三段自有提示词必须
    # 按字面渲染（0.1.6 interpolate:false / 旧内核 sanitize 兜底）、引用文件超大不注入、
    # 投影未变化时不重复写 settings。脚本自带两条负向对照（还原缺陷后断言必须报红）。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/prompt.contract.selftest.mjs

  # 文档引用契约门（`scripts/prompt-contract.assert.mjs`，2026-09-28 裁定 #82④ 批准挂 CI）：
  # 扫 `docs/agents/**/*.md` 里三类**机器可判定**的失真 —— C1「路径:行号」引用越界/倒序/本仓无此文件 ·
  # C2「路径 + N 行」字面量与现盘不符（豁免词 `会漂`/`现测`/`原写` 与「同行提交号」两条例外）·
  # C3 已废口径（followup 投递）仍被当作现行通道宣称。
  # ⚠️ **弱视野（必须记下，不得假装它是全量检查）**：CI 语料里 `git ls-files docs` 只有 1 份 .md
  #    （`docs/agents/` 全树命中 `.gitignore`）⇒ 本门在 CI 只看到 1 份文档、花名册绝大多数条目走
  #    「跳过 N 条登记项（所在文件不在视野）」。它在这里能证明的是**「能跑、不崩、代码库自身形态自洽」**，
  #    不是「全部协作文档无陈旧引用」。全量判定只能在本机工作树上做。
  # 保留 `fetch-depth: 0`：本门自身只读工作树、**不依赖 git 历史**（与 `anchor-contract` 的 `rev^` 不同），
  #    此处按裁定 #82④ 的 CI 规矩保留，代价是 fetch 变慢。
  prompt-contract-assert:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/prompt-contract.assert.mjs

  request-guard:
    # Origin 守卫门（`lib/request-guard.js`）：47 条用例（四种输入 × 两种绑定模式）× 4 条结构断言
    # × 7 条变异 × 真 originGuard 挂临时 HTTP 服务器的薄层。`--selftest` 必须带：只跑真实对照
    # 就漏掉了「门自己还能不能红」这半边（D1 = 谁把 `!== ALL_INTERFACES_BIND` 翻回等值判断即红）。
    #
    # 为什么本门**可以**挂 CI（与 §D 步骤 10 那两条「不挂 CI」的门不同）：它**不需要任何外部输入** ——
    # 不读已装 profile、不读 harness checkout、不打活端口，全部靠自起临时服务器与纯函数；
    # 故在只有插件仓库的 CI 里也能给出真判定，**不会**退化成「未完成验证」的假红。
    # （对照：dependency-skew 要 `<DSH_HOME>/profiles/web`、dsh-log-ui.drift 要 harness checkout ⇒ 那两条不挂。）
    #
    # 为什么这条断言值得占一个 CI job（2026-09-22 的实证）：手动跑的门靠人的自觉，挂 CI 的门在人
    # 不自觉时会红。而「把条件翻回等值判断」这种改动最容易藏在一次看似无关的重构里 ⇒ D1 那条断言的
    # 价值**只有挂上 CI 才兑现**。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/request-guard.assert.mjs --selftest

  scope-identifiers:
    # 标识符作用域门（`client/client.js`）：每个 IIFE 模块块里「用到的模块别名」必须在**该块内**有
    # require 绑定。守的是 2026-09-22 那个活了 4 天的形态 —— 模块 4 调 `react.useState` 而只 require
    # 了 `react/jsx-runtime`（两条不同的 require）⇒ `ReferenceError: react is not defined`
    # ⇒ slot 渲染器把抛错吞掉、整条 entry 消失 ⇒ 用户看到的是「按钮不见了」，不是报错。
    # 它穿过当时**全部**门：语法门（语法合法）· 打包门（入口可达）· 锚门（哈希对）· primitives-export
    # （只核 primitives.X 的成员是否存在）⇒ 这一格原本无人守。
    #
    # 为什么可以挂 CI（与 §D 步骤 10 那两条不同）：**零外部输入** —— 只读 `client/client.js` 一个文件，
    # 不读 profile、不读 harness checkout、不打任何端口 ⇒ 在只有插件仓库的 CI 里也能给出真判定。
    #
    # 门自带三道自保：① 块切分失配即报红（块头/闭包数不自洽、或块数≠基线 ⇒ **不许**当成
    # "没有块要检查"返回 0）；② 变异未生效即判失败；③ 负向对照（还原本次缺陷）必须红、惰性对照必须不红。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scope-identifiers.assert.mjs --selftest

  workspace-prompt-guard:
    # 工作区提示词不被写空（`lib/global-prompt.js`）：五格判据（正文保持 / files 不被整体替换 /
    # 未点名条目不连带 / removed 三条契约 / 回写只带新增条目）。`--selftest` 必须带：只跑真实对照
    # 就漏掉了「门自己还能不能红」这半边（M1 取值层级 / M2 removed ref / M3 回写作用域）。
    #
    # 为什么本门**可以**挂 CI（判据同 `:119 request-guard` 那段：红是否可被合理驳回）：
    # ① 零外部输入 —— 只读本仓库 `lib/global-prompt.js`，其余全在 os.tmpdir() 的副本里跑，
    #    不读已装 profile、不读 harness checkout、不打任何端口 ⇒ 在只有插件仓库的 CI 里也能给出真判定；
    # ② 属**契约门** —— 它的红只有一个动作（修 `lib/` 或修门），没有"这次可以放过"的合法理由。
    # 为什么值得占一个 job（2026-09-26 实证）：本缺陷在盘上活了很久，症状是「用户粘贴的正文变成空」，
    # 而当时**全部门都绿** —— 语法门、打包门、锚门、primitive 导出门与「写回语义」都不相交。
    #
    # 与 §D 步骤 10 那两条「不挂 CI」的门对照：`dependency-skew` 要 `<DSH_HOME>/profiles/web`、
    # `dsh-log-ui.drift` 要 harness checkout ⇒ 那两条在纯插件仓库的 CI 里会退化成「未完成验证」的假红；
    # 本门不需要任何外部路径，故挂着不退化。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/workspace-prompt.guard.assert.mjs --selftest

  group-prompt-contract:
    # 组提示词契约（`lib/global-prompt.js` 第三段 + `lib/prompt-dedup.js` 名字表 + 状态路由 shape）：
    # 八格判据（enabled 判定 / 成员判定 / 键序拼接与 '\n\n' / interpolate:false 字面保真 /
    # 路由 sessions 形状 / 缓存命名空间不互相剔除 / TARGET_NAMES 含组段 / 组命名空间剔除不越界）。
    # `--selftest` 必须带：只跑真实对照就漏掉了「门自己还能不能红」这半边，且本门**九份变异各点名
    # 一条判据**；九格里有两条曾长期是**空断言**（变异下读数与基线逐项相同），是靠自证才发现并修掉的
    # —— 没有 `--selftest` 这两条会一直假装在守。
    #
    # 为什么本门**可以**挂 CI（判据同 `:119 request-guard` 那段：红是否可被合理驳回）：
    # ① 零外部输入 —— 只读本仓库 `lib/global-prompt.js` / `lib/prompt-dedup.js`，其余全在 os.tmpdir()
    #    的副本里跑（含 request-guard 桩），不读已装 profile、不读 harness checkout、不打任何端口；
    # ② 属**契约门** —— 它的红只有一个动作（修 `lib/` 或修门），没有"这次可以放过"的合法理由。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/group-prompt.contract.assert.mjs --selftest

  settings-layout-assert:
    # 设置页布局不变式门（`client/client.js` 内的 CSS 与 DOM 结构 + 平台 native 观感对齐）：
    # 六格判据 = 页面根/卡片不得是拉伸件 · 不得出现嵌套滚动组合 · 标签条为原生文字标签形态
    # （无填充背景 + 行底 0.5px `var(--dsw-alias-border-l2)` + `::after` 2px 激活条）· 标题/副标题
    # 取平台字号量（18/13）且颜色直取平台 token · 切页归位（`setTabSafely` 内 `setTab(...)` +
    # 受守卫的 `scrollIntoView({block:'start'})`，且接到 TabBar 的 onTab）· 会话勾选（处理函数同步
    # 提交本地状态、不直接写宿主，且宿主快照回灌有 pending 守卫）。
    # `--selftest` 必须带：只跑真实对照就漏掉了「门自己还能不能红」这半边，且本门**九份变异各点名
    # 一条判据**，把「机制有效（点名报红 + 无连带翻转）」与「真绿变红」分开报（有两条判据基线本来就
    # 红时，只证「注入生效让点名判据报出这条」，不得读作自证通过）。
    #
    # 为什么本门**可以**挂 CI（判据同 `:198 group-prompt-contract` 那段：红是否可被合理驳回）：
    # ① 零外部输入 —— 只读本仓库 `client/client.js`，破坏全在 os.tmpdir() 副本上做，不读已装
    #    profile、不读 harness checkout、不打任何端口；
    # ② 属**契约门** —— 它的红只有一个动作（修 `client/client.js` 或修门），没有"这次可以放过"的
    #    合法理由。判据边界：**只证结构，不证时序与视觉**（如 A5 的归位是否真的发生、A6 的延迟
    #    是否真的消失，需人类复验）。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/settings-layout.assert.mjs --selftest

  session-picker-assert:
    # 会话选择器契约门（`client/client.js` 的 SessionPicker / GroupRow 结构）：
    # 六格判据 = ① 会话按 cwd 分组、每组标题含「已选/总数」（逐个头核，不「找到一个就算」）
    # ② 每组「全选本组/取消本组」的 id 列表派生自**该组 items**（不是全量 live）
    # ③ 过滤框 +「已选 N / 共 M」+「清空选择」，且过滤状态 setter **确实**在 input.onChange 里被调用
    #   （只判「有输入框 + 有 needle」是空断言：把 onChange 体掏空仍然全绿 —— 实测过）
    # ④ 离线成员被渲染成行、行内不得有可勾复选框、必须有带 `aria-label` 的显式移除控件，
    #   且离线集合仍是「已选 − 在线」的派生（裁定 #66 的行为契约：离线成员只可移除、不可勾选）
    # ⑤ 组内开关用 `groupEnableLabel`、GroupRow 体内不得再出现 `enableLabel`（§215.3 语义相反缺陷）
    # ⑥ 选择器作用域内不得出现 `overflow:auto|scroll` 规则（平台约定「滚动归外壳」）。
    #
    # 为什么本门**可以**挂 CI（判据同 `:223 settings-layout-assert`：红是否可被合理驳回）：**不能**。
    #  ① 零外部输入 —— 只读本仓库 `client/client.js`，破坏全在 os.tmpdir() 副本上做，
    #     不读已装 profile、不读 harness checkout、不打任何端口；
    #  ② 属**契约门** —— 它的红只有一个动作（修 `client/client.js` 或修门），没有"这次可以放过"的
    #     合法理由。判据边界：**只证结构，不证时序与视觉**（勾选延迟是否真的消失、Pill 与激活条的
    #     真机观感，需人类复验）。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/session-picker.assert.mjs --selftest

  group-new-submit-assert:
    # 「新建组」提交路径契约门（`client/client.js` 的 dsw-group-new-input）：
    # 三格判据 = ① 新建组输入框的 props 里**不存在**任何键盘分支（onKeyDown 缺席，且 props 不出现
    #   创建函数名）—— 人类所有者原话：「输入组名后按回车键会直接创建组，这个需要调整，不能回车
    #   直接创建，要点击新建组按钮才能创建」；
    # ② 同一卡片里的主色按钮仍以 `onClick` 绑定 `addGroup`，且 `disabled` 仍是「空名禁用」
    #   （防的是「回车删了、按钮也一起改坏」这种修一半）；
    # ③ 另三处键盘路径逐字未动（引用文件输入的回车、重命名输入的回车、Ctrl/Cmd+S 保存）——
    #   `anchor()` 要求逐字命中**且全程唯一**，防的是「把回车分支挪到别的输入」被算成通过。
    #
    # 为什么本门**可以**挂 CI（判据同 `:250 session-picker-assert`：红是否可被合理驳回）：**不能**。
    #  ① 零外部输入 —— 只读本仓库 `client/client.js`，变异全在内存副本上做，不读已装 profile、
    #     不读 harness checkout、不打任何端口；自检的负向对照吃的是 `scripts/fixtures/` 里两份
    #     冻结夹具，不读 git 历史、不读盘上活件（否则 C 的改动一提交，自检会自己变红）；
    #  ② 属**契约门** —— 它的红只有一个动作（修 `client/client.js` 或修门），没有"这次可以放过"的
    #     合法理由。判据边界：**只证源码结构，不证运行期行为**（回车到底还建不建组、按钮点击是否
    #     真的落库，需人类真机复验）；判据按 className + props 文本定位，**不写行号**。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/group-new-submit.assert.mjs --selftest

  # ── rc1 基座门（`scripts/rc1-basis.assert.mjs`）· 裁定 #rc1-D-8（BL-073 = 挂）────────
  # 为什么它**能**在 CI 里跑（沿用 `:250`/`:289` 两条的判据：该上下文里红是否可达/可被合理驳回）
  #  ① 前置全公开可解析：rc1 基座就是本仓自带的 `pnpm-lock.yaml` 钉出来的那套
  #     （`--frozen-lockfile`，**不改 `package.json` 一个字节**）；alpha 对照基座靠
  #     `pnpm-workspace.yaml` 的 `overrides:` 注入版本（`package.json` 同样逐位不变
  #     ⇒ 两棵树的 §0 锚表各自自洽、`package.json` 的 hash 相同 ⇒ D 对拍不被 manifest 差异污染）。
  #     ⚠️ 这两条是 D 实测出来的**前提**，不是设计偏好：钉 `package.json` 会让发布树的锚门必红
  #        （`package.json` 是 §0 登记项），而 D 会把它读成"版本敏感"⇒ 测量被污染。
  #  ② 属**契约门**：四条断言（A 解析面 / B auto-resume 契约 / C 既有命令哨兵 / D 两基座对拍）
  #     的红都只有一个动作（修），没有"这次可以放过"的合法理由 ⇒ 挂进 `publish-npm.needs`。
  #     ⚠️ D 的红 = 「某条既有命令的输出对依赖版本敏感」，真出现过（`docs/agents/board/d.md` §96-D
  #        点到 `anchor` 与 `auto-resume` 两条）。这类红**必须有人看**，不许静默。
  #  ③ 退出码语义（门头部注释）：`0` 全成立 · `1` 有断言不成立 · `3` 前置不成立（未完成验证，
  #     不得读作通过）· `64` 用法错。**3 也算失败**（fail-closed：CI 里没有人工，取不到读数
  #     就等于没验证 —— 这是门的既有语义，本 job 不改它）。
  # 基座怎么来（三步，与门头部注释一致）：clone 本仓（`.git` 要完整 ⇒ 本 job `fetch-depth: 0`）
  #   → 装依赖（rc1 冻结锁；alpha 用 overrides 重解一次）→ 两者都提交成**干净提交树**。
  #   ⚠️ alpha 基座必须**用 `--amend`、不增提交数**：`auto-resume` 门会打印「全史（N 个提交）」，
  #      两侧提交数不等会造出**假差异** ⇒ D 误判红（D 本轮实测踩过，故 step 里 `diff -q` 自证
  #      manifest 逐位相同，并打印两侧提交数供日志留痕）。
  rc1-basis:
    name: rc1 基座门（跨代版本组合 + 既有命令哨兵）
    runs-on: ubuntu-latest
    # 上界 90 分钟（裁定 #rc1-D-9①）：本机真树实测 wall = 2068 秒（约 34.5 分钟，含两棵树 × 20 条命令
    # 各跑一遍），CI runner 通常更慢 ⇒ 取约 2.4× 余量。这个值是**上界**，不是期望耗时；
    # 单条命令的超时另有 --timeout（见下），两者是不同层级：这条管整个 job，那条管一条命令。
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 为什么本 job 独有这一段（其他 14 个 job 都没有）：见 D 的 #rc1-D-11 依据与实测（board/d.md §103-D）。
      # ① 只有本 job 跑 `pnpm install`（其余 job 只用 node/npm）⇒ CI 首跑在第一棵基座就 `pnpm: command not found`（exit 127）；
      # ② 本仓 `package.json` 没有 `packageManager` 字段 ⇒ 单跑 `corepack enable` 不知道装哪个版本，必须显式给版本；
      # ③ **不用 corepack**：Node 20 自带的 corepack 0.33.0 与 pnpm 12.x 不兼容（shim 要 `…/12.4.1/bin/pnpm.cjs`，
      #    而 pnpm 12 只发 `bin/pnpm.mjs`）—— 本机用 Node 20.19.5 同版本实测复现，详见 §103-D.4。改用 npm 装到 job 私有前缀：
      #    零第三方 action、版本钉死、且与 runner 上可能预装的 pnpm **不可能撞车**（本步立刻按绝对路径强校验）。
      # ④ 版本 12.4.1 的选择依据（不是凭印象）：`pnpm-lock.yaml` 的 `lockfileVersion: '9.0'` 与
      #    `pnpm-workspace.yaml` 的 `minimumReleaseAgeExclude` / `overrides` 键面都由它支持 —— 本机同版本实测
      #    `--frozen-lockfile --lockfile-only` EXIT 0 且锁文件帧逐位未变（§103-D.3）。
      - name: 准备 pnpm 12.4.1（npm 装到 job 私有前缀；不用第三方 action）
        run: |
          set -euo pipefail
          export npm_config_cache="${RUNNER_TEMP}/npm-cache"
          npm install -g --prefix "${RUNNER_TEMP}/pnpm" pnpm@12.4.1
          echo "${RUNNER_TEMP}/pnpm/bin" >> "$GITHUB_PATH"
          # 同一段里立刻把前缀放进 PATH：这样「后面几步用哪一个」在本步就已确定，
          # 不依赖 GITHUB_PATH 生效时机（重跑本步时也不会被 runner 预装的 pnpm 抢先）。
          export PATH="${RUNNER_TEMP}/pnpm/bin:$PATH"
          PNPM_BIN="${RUNNER_TEMP}/pnpm/bin/pnpm"
          hash -r
          echo "pnpm 来自 $(command -v pnpm || echo '(PATH 里找不到 pnpm！)')"
          if [ ! -x "$PNPM_BIN" ]; then
            echo "::error::npm 没有装出 ${PNPM_BIN}"
            exit 1
          fi
          if [ "$("$PNPM_BIN" --version)" != "12.4.1" ]; then
            echo "::error::pnpm 版本不是 12.4.1，实测 = $("$PNPM_BIN" --version)"
            exit 1
          fi
          # 强校验「后面几步用的那一个」就是本步装的这一个（防止与 runner 预装的 pnpm 撞车后静默用错）
          if [ "$(command -v pnpm)" != "$PNPM_BIN" ]; then
            echo "::error::PATH 里的 pnpm = $(command -v pnpm)，但本步期望它 = ${PNPM_BIN}（下一步会用到错的那个）"
            exit 1
          fi
          echo "pnpm $("$PNPM_BIN" --version) 就绪（$(command -v pnpm)）"

      - name: 建 rc1 基座（LOCKFILE-FROZEN）
        run: |
          set -euo pipefail
          BASE="${RUNNER_TEMP}/rc1-base"
          STORE="${RUNNER_TEMP}/rc1-store"
          git clone --no-hardlinks --quiet . "$BASE"
          cd "$BASE"
          pnpm install --frozen-lockfile --ignore-scripts --store-dir "$STORE"
          echo "rc1 基座提交数=$(git rev-list --count HEAD)"

      - name: 建 alpha 对照基座（WORKSPACE-OVERRIDES）
        run: |
          set -euo pipefail
          ALPHA="${RUNNER_TEMP}/rc1-alpha"
          STORE="${RUNNER_TEMP}/rc1-store"
          git clone --no-hardlinks --quiet . "$ALPHA"
          cd "$ALPHA"

          cat >> pnpm-workspace.yaml <<'YAML'
          overrides:
            "@deepseek-ai/dsh-home-paths": 0.1.7-alpha.1
            "@deepseek-ai/dsh-tools": 0.1.7-alpha.1
            "@deepseek-ai/dsh-client-locale": 0.1.7-alpha.1
            "@deepseek-ai/dsh-client-store": 0.1.7-alpha.1
            "@deepseek-ai/dsh-client-ui-primitives": 0.1.7-alpha.1
            "@deepseek-ai/cordis": 4.0.3
            "@deepseek-ai/schemastery": 3.18.3
          YAML

          # ⚠ 必须显式 --no-frozen-lockfile（裁定 #rc1-D-12①，D 本地三组实测；依据见 board/d.md §104-D）：
          #   GitHub Actions 设 CI=true ⇒ pnpm 在非 TTY 下对这个命令**默认启用 frozen 语义**，于是
          #   上面刚追加的 7 条 overrides 与锁文件记录不符 ⇒ ERR_PNPM_LOCKFILE_CONFIG_MISMATCH（真机 run 36511811286 复现）。
          #   两步的语义**故意不同**，不是笔误：
          #     #5 rc1 基座  = 锁文件必须**原样**成立（--frozen-lockfile）——它代表「本仓声明与锁文件自洽」；
          #     #6 alpha 基座 = **故意**构造「版本被 overrides 改写」的对照树 ⇒ 必须允许 pnpm 重算锁文件，
          #                    否则这棵树根本建不起来，D 断言（两基座归一化对拍）就永远跑不到。
          #   本地实测（pnpm 12.4.1 · 与 CI 同版本）：CI=true 无此 flag ⇒ EXIT 1；CI=true 加此 flag ⇒ EXIT 0；
          #   不加 flag 且无 CI 变量 ⇒ EXIT 0（这就是本机重放漏判的原因：装置少设了 CI=true 这一维）。
          pnpm install --no-frozen-lockfile --ignore-scripts --store-dir "$STORE"

          git -c user.name=ci -c user.email=ci@local commit --quiet -a --amend --no-edit
          git status --porcelain

          diff -q package.json "${RUNNER_TEMP}/rc1-base/package.json"
          echo "alpha 基座提交数=$(git rev-list --count HEAD)"

      - name: rc1 基座门（四条断言）
        run: |
          set -o pipefail
          node scripts/rc1-basis.assert.mjs \
            --base "${RUNNER_TEMP}/rc1-base" \
            --alpha-base "${RUNNER_TEMP}/rc1-alpha" \
            --timeout 1800 \
            --verbose 2>&1 | tee "${RUNNER_TEMP}/rc1-basis.log"

  publish-npm:
    # 断言不再能报红与断言失败同样致命，故发布依赖 selftest 与两道契约门（裁定 #35/#53：
    # 静默的契约断裂曾被发布出去，只挂在 push/PR 上的门拦不住发布，必须在发布路径上）。
    # 注：分界判据是**红是否可被合理驳回**，依此分两类 ——
    #     · **契约门**：红只有一个动作（修它），故挂 `needs`，一次安全回归都不该被发布出去；
    #     · **探测器**：红在合法重构下可被讨论（改个常数、换个别名），故**既不进 `needs`、也不接进
    #       本 workflow 的任何步骤**，只由「必跑」的流程项约束（人监督清单项，同 §D.3 改行号重核）。
    #     `scripts/clamp-call.assert.mjs` 经裁定归**探测器**（文本级调用计数、别名可绕、红在合法重构下
    #     属设计如此），故它不在本 workflow 里；它挂 package.json 的 assert:clamp / assert:clamp:selftest，
    #     由「改 client/client.js 钳制段时必跑」约束。**本 job 内也没有它的步骤**。
    #     （对照：`:46 dependency-skew.measure.mjs --selftest` 与 `:47 dsh-log-ui.drift.mjs --selftest`
    #      确实在 `selftest` job 里跑 —— 它们是**不需要外部 checkout**的自证步骤；本条之所以例外在
    #      「不进任何步骤」，理由是上面的"可被合理驳回"，与它们能否在 CI 跑无关。）
    needs: [verify, selftest, auto-resume-contract, anchor-contract, prompt-contract, prompt-contract-assert, request-guard, scope-identifiers, workspace-prompt-guard, group-prompt-contract, settings-layout-assert, session-picker-assert, group-new-submit-assert, rc1-basis]
      # ⚠️ `rc1-basis` **加入 needs**（D 的判断，裁定 #rc1-D-8 授权范围内）：判据同上「红是否可被
      #   合理驳回」。它的四种红都不可驳回 —— ①解析到 alpha 线（跨代组合）②基座里既有命令有红的
      #   ③两基座对拍出现差异 ④取不到读数（EXIT 3，fail-closed）。③ 尤其：某条命令的输出对依赖
      #   版本敏感，正是「宿主换了、插件没跟上」这类静默断裂的信号，与 §0 那条教训同源
      #   （"静默的契约断裂曾被发布出去"）。代价是发布可能被挡住一次，收益是挡不住的回归不会
      #   被发出去 —— 两者不对称，故选挡。若某次红确属环境（registry 抖动导致 EXIT 3），
      #   重跑 Release 即可，不需要改门。
    # ⚠️ `request-guard` **加入 needs**（D 的判断；按上面的分界判据，它是契约门而非探测器，故不冲突）：
    #   判据同上：**红是否可被合理驳回**。
    #     · `clamp-call` 属探测器 —— 它的红在合法重构下**可被合理讨论**（改个常数即可），
    #       把可驳回的红接上发布路径会训练人忽略红 ⇒ 不进任何步骤（裁定 #53）。
    #     · 本门属**契约门** —— 它的红（`lib/request-guard.js` 的判定与契约不符、或门自身不再能红）
    #       **只有一个动作**：修它。没有"这次可以放过"的合法理由。
    #   ⇒ **一次安全回归不该被发布出去**：把它接在发布路径上，代价是"发布被挡住一次"，
    #     而漏放的代价是"两道路由的来源判定失效且没人知道"。两者不对称，故选挡。
    # 只有释放事件才发布；push / PR / 手动触发只跑验证门。
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      # 防止「release 的 tag 与包版本不一致」导致发错版本。
      # 显式枚举且逐字匹配：接受 v0.1.7 / 0.1.7 / release-0.1.7，拒绝 v0.1.70、v10.1.7、v0.1.7-rc1。
      # tag 经 env 中转而非内插进脚本，避免 tag 文本成为 shell 注入面。
      - name: Check release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$TAG" in
            "v$VERSION"|"$VERSION"|"release-$VERSION") echo "tag $TAG 与版本 $VERSION 一致" ;;
            *) echo "::error::release tag '$TAG' 与 package.json 版本 '$VERSION' 不一致——请用 v$VERSION 重新打 tag"; exit 1 ;;
          esac
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
